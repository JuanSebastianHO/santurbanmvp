<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080b09" />
    <meta name="description" content="SanturBio — Sistema PWA Offline-First para el Monitoreo de Biodiversidad y Alertas Ambientales en el Páramo de Santurbán." />

    <title>SanturBio — Monitoreo de Biodiversidad</title>

    <!-- Manifiesto PWA -->
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./assets/icons/app-icon.svg" />

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin="anonymous"
    />

    <!-- Hojas de Estilo del Proyecto -->
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
</head>
<body>
    <!-- Barra Superior de Estado y Navegación -->
    <header class="app-topbar" role="banner">
        <div class="brand-block">
            <img
                src="./assets/icons/app-icon.svg"
                alt="Logo SanturBio"
                class="brand-icon"
                width="44"
                height="44"
            />
            <div>
                <div class="brand-title">SanturBio</div>
                <div class="brand-subtitle">Monitoreo Científico de Biodiversidad</div>
            </div>
        </div>

        <div class="topbar-controls">
            <!-- Indicador de Conectividad en Tiempo Real -->
            <div id="network-status-pill" class="status-pill status-online" role="status" aria-live="polite">
                <span class="status-pill-dot"></span>
                <span id="network-status-text">Verificando red...</span>
            </div>

            <!-- Indicador de Cola de Sincronización -->
            <span id="sync-queue-badge" class="role-badge hidden" title="Registros pendientes por sincronizar">
                0 pendientes
            </span>

            <!-- Botón de Instalación PWA -->
            <button id="pwa-install-btn" type="button" class="btn btn-secondary btn-sm hidden">
                Instalar App
            </button>

            <!-- Información de Usuario y Rol (Visible tras iniciar sesión) -->
            <div id="user-session-bar" class="topbar-controls hidden">
                <span id="user-role-badge" class="role-badge"></span>
                <span id="user-name-label" class="brand-subtitle"></span>
                <button id="view-switch-btn" type="button" class="btn btn-secondary btn-sm hidden">
                    Cambiar Vista
                </button>
                <button id="logout-btn" type="button" class="btn btn-danger btn-sm">
                    Cerrar Sesión
                </button>
            </div>
        </div>
    </header>

    <!-- Contenedor Principal Dinámico -->
    <main id="app-root" class="app-main-container" role="main">
        <div class="panel-card">
            <p>Inicializando módulos locales y verificando sesión segura...</p>
        </div>
    </main>

    <!-- Contenedor para Modales (Corrección Auditada de Metadatos / Detalles) -->
    <div id="modal-root" class="hidden" aria-live="polite"></div>

    <!-- Bibliotecas Geográficas: Leaflet.js + Leaflet.heat -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        crossorigin="anonymous"
    ></script>
    <script
        src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"
        crossorigin="anonymous"
    ></script>

    <!-- Punto de Entrada Principal (ES6 Modules) -->
    <script type="module" src="./js/app.js"></script>
</body>
</html>
